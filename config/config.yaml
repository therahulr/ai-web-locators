# AI-Assisted Locator Generation Tool Configuration

# OpenAI Configuration
openai:
  api_key_env: "OPENAI_API_KEY"  # Environment variable name
  model: "gpt-4o"                # gpt-4o, gpt-4o-mini, gpt-4-turbo
  max_tokens: 4000
  temperature: 0.3               # Lower = more deterministic

# Browser Configuration
browser:
  type: "playwright"             # playwright or selenium
  headless: false                # true = no browser window
  window_size: [1920, 1080]
  timeout: 30000                 # milliseconds

# Locator Configuration
locator:
  priority: ["id", "xpath", "css"]  # Preference order
  retry_attempts: 3              # AI retry attempts for failed validations
  validation_timeout: 5000       # milliseconds

# Output Paths
output:
  locators_dir: "output/locators"
  docs_dir: "output/docs"
  sessions_dir: "output/sessions"

# Logging Configuration
logging:
  level: "INFO"                  # DEBUG, INFO, WARNING, ERROR
  file: "logs/app.log"
  max_bytes: 10485760            # 10MB
  backup_count: 5
